const eur = n => new Intl.NumberFormat(LOCALE[lang] || lang, { style: "currency", currency: "EUR" }).format(n);
let lang = "fr";
const saleActive = () => !SALE_ENDS || Date.now() < new Date(SALE_ENDS).getTime();
const onSale = p => saleActive() && p.salePrice !== null && p.salePrice !== "" && p.salePrice < p.price;
const unit = p => onSale(p) ? p.salePrice : p.price;
const cartTotal = () => cart.reduce((s, c) => s + unit(PRODUCTS[c.i]) * c.qty, 0) + (cart.length && $("protect").checked ? PROTECTION : 0);
const cart = [];
const $ = id => document.getElementById(id);

const colorOf = c => { const p = PRODUCTS[c.i]; return p.colors ? p.colors[c.c || 0] : null; };
const colorName = c => { const k = colorOf(c); return k ? tr(k.name) : ""; };
function cardImg(p, k) {
  const sale = onSale(p);
  const src = (k && k.image) || p.image, src2 = (k && k.image2) || p.image2;
  const alt = tr(p.name) + (k ? " " + tr(k.name) : "");
  return `${sale ? `<span class="tag">-${Math.round((1 - p.salePrice / p.price) * 100)}%</span>` : ""}
        ${src ? `<img src="${src}" alt="${alt}" loading="lazy">` : `<span>OBSYD</span>`}
        ${src2 ? `<img class="alt" src="${src2}" alt="" loading="lazy">` : ""}`;
}

function render() {
  $("grid").innerHTML = PRODUCTS.map((p, i) => {
    const sale = onSale(p);
    const pct = sale ? Math.round((1 - p.salePrice / p.price) * 100) : 0;
    return `<article class="card">
      <div class="img">${cardImg(p, p.colors && p.colors[0])}</div>
      <h3>${tr(p.name)}</h3>
      <div class="price">
        <span class="now${sale ? " sale" : ""}">${eur(sale ? p.salePrice : p.price)}</span>
        ${sale ? `<span class="old">${eur(p.price)}</span>` : ""}

      ${p.colors ? `<p class="colorlabel">${T[lang].color}: <b>${tr(p.colors[0].name)}</b></p><div class="swatches">${p.colors.map((k, n) => `<button type="button" data-c="${n}"${n === 0 ? ' class="on"' : ""} aria-label="${tr(k.name)}"><i style="background:${k.hex}"></i></button>`).join("")}</div>` : ""}

function renderCart() {
  $("count").textContent = cart.reduce((n, c) => n + c.qty, 0);
  try { localStorage.setItem("obsyd-cart", JSON.stringify(cart)); } catch (e) {}
  $("protRow").hidden = !cart.length;
  $("protPrice").textContent = eur(PROTECTION);
  $("lines").innerHTML = cart.length
    ? cart.map((c, i) => { const p = PRODUCTS[c.i]; return `<div class="line"><span>${tr(p.name)}<br><span class="note">${T[lang].size} ${c.size}${colorName(c) ? " · " + T[lang].color + " " + colorName(c) : ""}</span><span class="qty"><button data-q="${i}" data-d="-1" aria-label="−">−</button><b>${c.qty}</b><button data-q="${i}" data-d="1" aria-label="+">+</button></span><button data-r="${i}">${T[lang].remove}</button></span><span>${eur(unit(p) * c.qty)}</span></div>`; }).join("")
    : `<p>${T[lang].empty}</p>`;
  const tot = cartTotal();

$("grid").addEventListener("click", e => {
  if (e.target.closest(".guidebtn")) { $("guide").showModal(); return; }
  const sw = e.target.closest(".swatches button");
  if (sw) {
    const card = sw.closest(".card"), p = PRODUCTS[card.querySelector(".add").dataset.i], k = p.colors[+sw.dataset.c];
    sw.parentNode.querySelectorAll("button").forEach(x => x.classList.toggle("on", x === sw));
    card.querySelector(".colorlabel b").textContent = tr(k.name);
    card.querySelector(".img").innerHTML = cardImg(p, k);
    return;
  }
  const sz = e.target.closest(".sizes button");
  if (sz) {
    sz.parentNode.querySelectorAll("button").forEach(x => x.classList.toggle("on", x === sz));
    sz.parentNode.classList.remove("err");
    sz.closest(".card").querySelector(".hint").hidden = true;
    return;
  }
  const b = e.target.closest(".add");
  if (!b) return;
  const card = b.closest(".card");
  const on = card.querySelector(".sizes .on");
  if (!on) {
    card.querySelector(".sizes").classList.add("err");
    card.querySelector(".hint").hidden = false;
    return;
  }
  const p = PRODUCTS[b.dataset.i];
  const sale = onSale(p);
  const size = on.textContent, idx = +b.dataset.i;

  if (found) found.qty++; else cart.push({ i: idx, size, c: col, qty: 1 });

  const path = e.composedPath();
  if (path.includes($("drawer")) || path.includes($("openCart")) || path.includes($("mbar")) || path.some(n => n.classList && n.classList.contains("add"))) return;
  $("drawer").classList.remove("open");
});

let wasActive = saleActive();
function tick() {
  const a = saleActive();
  if (a !== wasActive) { wasActive = a; render(); renderCart(); renderBanner(); }
  const el = $("timer");
  if (!SALE_ENDS || !a) { el.hidden = true; return; }
  const t = Math.max(0, Math.floor((new Date(SALE_ENDS).getTime() - Date.now()) / 1000));
  const pad = n => String(n).padStart(2, "0");
  el.textContent = `${T[lang].ends} ${Math.floor(t / 86400)}${T[lang].du} ${pad(Math.floor(t % 86400 / 3600))}:${pad(Math.floor(t % 3600 / 60))}:${pad(t % 60)}`;
  el.hidden = false;
}

if (/[?&]paid=1/.test(location.search)) {
  cart.length = 0;
  $("thanks").hidden = false;
  try { history.replaceState(null, "", location.pathname); } catch (e) {}
}

const drawerEl = $("drawer");
drawerEl.inert = true;
new MutationObserver(() => {
  const open = drawerEl.classList.contains("open");
  drawerEl.inert = !open;
  if (open) $("closeCart").focus({ preventScroll: true });
}).observe(drawerEl, { attributes: true, attributeFilter: ["class"] });

$("nlForm").addEventListener("submit", async e => {
  e.preventDefault();
  const f = e.target, ok = $("nlOk");
  let sent = false;
  try {
    const res = await fetch("/", { method: "POST", headers: { "Content-Type": "application/x-www-form-urlencoded" }, body: new URLSearchParams(new FormData(f)).toString() });
    sent = res.ok;
  } catch (err) {}
  ok.textContent = sent ? T[lang].nl_ok : T[lang].co_fail;
  if (sent) { f.hidden = true; $("nlNote").hidden = true; }
});

/* Base language is French. A visitor's own choice is remembered. */
let start = "fr";
try { const saved = localStorage.getItem("obsyd-lang"); if (T[saved]) start = saved; } catch (e) {}
setLang(start);
setInterval(tick, 1000);
tick();
</script>
</body>
</html>
